<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ECP Hotspot Editor</title>
  <style>/*__EDITOR_CSS__*/</style>
</head>
<body>
  <script id="ecp-review-payload" type="application/json">__REVIEW_STATE_JSON__</script>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <strong>ECP Hotspot Editor</strong>
        <span id="engagementLabel" class="subtle"></span>
      </div>
      <div id="deviceTabs" class="device-tabs"></div>
      <div class="topbar-spacer"></div>
      <span id="statusMessage" class="status-message" aria-live="polite"></span>
      <button id="saveState" title="Download review-state JSON (Ctrl+S)">Save JSON</button>
      <button id="exportFinal" class="primary" title="Write review state and render the final client report">Render Final Report</button>
    </header>
    <div id="errorMessage" class="error-message" aria-live="assertive" hidden></div>
    <div class="body">
      <aside class="sidebar">
        <div id="filterTabs" class="filter-tabs"></div>
        <div id="findingList" class="finding-list"></div>
      </aside>
      <section class="workspace">
        <div class="stagebar">
          <button id="prevSlide" title="Previous screenshot (Left arrow)">&#8592;</button>
          <span id="slideLabel" class="slide-label"></span>
          <button id="nextSlide" title="Next screenshot (Right arrow)">&#8594;</button>
          <span class="stagebar-sep"></span>
          <button id="fitStage" title="Fit screenshot to window (F)">Fit</button>
          <label class="zoom-label">Zoom <input id="zoomInput" type="range" min="25" max="200" value="100"></label>
          <label class="ghost-label"><input id="showGhosts" type="checkbox"> Show other hotspots</label>
        </div>
        <div id="slideStrip" class="slide-strip"></div>
        <div id="stageWrap" class="stage-wrap">
          <div id="stage" class="stage">
            <div class="stage-hud"><span id="hudText"></span></div>
            <img id="slideImage" alt="Screenshot" draggable="false">
            <div id="effectLayer" class="layer effect-layer"></div>
            <svg id="spotlightLayer" class="layer spotlight-layer" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
            <div id="markerLayer" class="layer marker-layer"></div>
            <svg id="connectorLayer" class="layer connector-layer"></svg>
            <div id="calloutLayer" class="layer callout-layer"></div>
            <div id="interactionLayer" class="layer interaction-layer"></div>
          </div>
        </div>
        <footer class="controlbar" id="controlBar">
          <div class="control-group" role="group" aria-label="Tool">
            <button id="toolHighlight" data-tool="highlight" class="tool is-active" title="Drag on the screenshot to draw or move the highlight box">Highlight</button>
            <button id="toolBlur" data-tool="blur" class="tool" title="Drag over distracting areas to blur them for this finding">Blur</button>
          </div>
          <div class="control-group" id="styleGroup" role="group" aria-label="Highlight style">
            <button data-style="outline" class="style-btn" title="Plain outline box">Outline</button>
            <button data-style="glow" class="style-btn" title="Outline with a glow halo">Glow</button>
            <button data-style="spotlight" class="style-btn" title="Dim everything outside the highlight box">Spotlight</button>
          </div>
          <div class="control-group" id="colorGroup" role="group" aria-label="Color">
            <button class="swatch" data-color="#EF4444" style="--sw:#EF4444" title="Critical red"></button>
            <button class="swatch" data-color="#F97316" style="--sw:#F97316" title="High orange"></button>
            <button class="swatch" data-color="#FACC15" style="--sw:#FACC15" title="Medium yellow"></button>
            <button class="swatch" data-color="#60A5FA" style="--sw:#60A5FA" title="Low blue"></button>
            <button class="swatch" data-color="#34D399" style="--sw:#34D399" title="Green"></button>
            <input id="customColor" type="color" value="#FACC15" title="Custom color">
          </div>
          <div class="control-group" id="regionControls" hidden>
            <label>Blur <input id="blurStrength" type="range" min="2" max="18" value="10"></label>
            <button id="deleteRegion" title="Remove the selected blur/dim region (Delete)">Remove region</button>
          </div>
          <div class="control-group">
            <label class="callout-toggle"><input id="calloutVisible" type="checkbox" checked> Callout</label>
          </div>
          <div class="control-group">
            <button id="undoAction" title="Undo (Ctrl+Z)">Undo</button>
            <button id="redoAction" title="Redo (Ctrl+Y)">Redo</button>
          </div>
          <div class="control-group control-group-end">
            <button id="hideFinding" title="Hide this finding from the report (H)">Hide</button>
            <button id="doneFinding" class="primary" title="Approve this finding and go to the next (A)">Done &#10003;</button>
          </div>
        </footer>
      </section>
    </div>
  </main>
  <script>//__EDITOR_JS__</script>
</body>
</html>
